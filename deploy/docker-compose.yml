# Orleeno production-style stack.
#   docker compose --env-file ../.env.production -f deploy/docker-compose.yml up -d --build
# Secrets come from the env file (never committed). Postgres is not published
# to the host; only nginx exposes 80/443.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?set DB_NAME}
      POSTGRES_USER: ${DB_USER:?set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    build: ..
    restart: unless-stopped
    command: ["api"]
    env_file: ${ENV_FILE:-../.env.production}
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      RUN_SCHEDULER: "false"
      RUN_MIGRATIONS: "true"
      TRUST_PROXY_HEADERS: "true"
      FORWARDED_ALLOW_IPS: "*"
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  scheduler:
    build: ..
    restart: unless-stopped
    command: ["scheduler"]
    env_file: ${ENV_FILE:-../.env.production}
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      RUN_MIGRATIONS: "false"
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:-./certs}:/etc/nginx/certs:ro
      - ${ADMIN_DIST_DIR:-../../mealoo_admin/dist}:/usr/share/nginx/admin:ro
    depends_on: [api]
    networks: [internal]

volumes:
  pgdata:
  uploads:

networks:
  internal:
